name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v3.2.22)'
        required: false
        default: 'v3.2.22'
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: 🛠️ Build Web Application (Vite)
        run: npm run build

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 🐘 Setup Gradle 8.5 (AGP 8.2 Compatible)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: 🤖 Setup Android SDK & Accept Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b1d8f69f3284649f877480f684422c" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a32ee5f96ac7357c43912be4d4b" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "24333f8a63b1d8f69f3284649f877480f684422c" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "84831b9409646a32ee5f96ac7357c43912be4d4b" >> "$ANDROID_HOME/licenses/android-googletv-license"
          echo "33b6a2b64f07f11b283f8552277db512842e4d4d" >> "$ANDROID_HOME/licenses/google-gdk-license"
          echo "e9acab5b5fbb560a72720eedac044649b8612b78" >> "$ANDROID_HOME/licenses/mips-android-sysimage-license"
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif command -v sdkmanager &> /dev/null; then
            yes | sdkmanager --licenses || true
          fi

      - name: 🔄 Sync Capacitor Android Assets
        run: |
          npx cap sync android || echo "Capacitor sync fallback"
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: 🔑 Make Gradlew Executable
        run: |
          cd android
          chmod +x gradlew || true

      - name: 🏗️ Build APK with Gradle
        run: |
          cd android
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --stacktrace --no-daemon || ./gradlew assembleDebug --stacktrace --no-daemon
          else
            ./gradlew assembleDebug --stacktrace --no-daemon
          fi

      - name: 🔍 Locate and Rename APK
        id: locate_apk
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ]; then
            VERSION="${{ github.event.inputs.version || 'v3.2.22' }}"
          fi
          
          mkdir -p release-artifacts
          
          # Find generated APK
          APK_PATH=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          
          if [ -f "$APK_PATH" ]; then
            TARGET_APK="release-artifacts/Reqable-Android-${VERSION}.apk"
            cp "$APK_PATH" "$TARGET_APK"
            echo "apk_path=$TARGET_APK" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "✅ Successfully prepared APK: $TARGET_APK"
          else
            echo "❌ APK file not found!"
            exit 1
          fi

      - name: 📤 Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Reqable-Android-${{ steps.locate_apk.outputs.version }}
          path: ${{ steps.locate_apk.outputs.apk_path }}
          retention-days: 30

      - name: 🚀 Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.locate_apk.outputs.version }}
          name: Reqable Android ${{ steps.locate_apk.outputs.version }}
          body: |
            # 📱 Reqable Android APK Release (${{ steps.locate_apk.outputs.version }})

            Automated Android APK build from GitHub Actions workflow.

            ### 🚀 Highlights
            - **App Package**: `com.reqable.android`
            - **Target Platform**: Android 8.0+ (API Level 26 - 34+)
            - **Features Included**:
              - API Traffic Debugging & Interception
              - Full REST/GraphQL API Client
              - MITM Rewriting & Mock Rules Engine
              - Gemini AI Traffic Copilot
              - OWASP API Security Vulnerability Scanner
              - Google Workspace Integration (Drive, Gmail, Meet)
              - Cloud Firestore Multi-Device Sync

            ### 📲 Installation Instructions:
            1. Download the `Reqable-Android-${{ steps.locate_apk.outputs.version }}.apk` asset below to your Android device.
            2. If prompted, allow "Install from Unknown Sources" in your Android Settings.
            3. Tap the downloaded APK file and click **Install**.
            4. Launch **Reqable** and start debugging your mobile APIs!
          files: ${{ steps.locate_apk.outputs.apk_path }}
          draft: false
          prerelease: false
